services:
  freightagent-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:5000}
        NEXT_PUBLIC_ACCESS_TOKEN_KEY: ${NEXT_PUBLIC_ACCESS_TOKEN_KEY:-access_token}
        NEXT_PUBLIC_REFRESH_TOKEN_KEY: ${NEXT_PUBLIC_REFRESH_TOKEN_KEY:-refresh_token}
        NEXT_PUBLIC_SESSION_TOKEN_KEY: ${NEXT_PUBLIC_SESSION_TOKEN_KEY:-session_token}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    image: freightagent-frontend:latest
    container_name: freightagent-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:5000/api/v1}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

