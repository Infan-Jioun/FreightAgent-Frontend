name: Continuous Integration (CI)

on:
  pull_request:
    branches: [main, master, develop, chat]
  push:
    branches: [chat, develop, "feature/**", "devops/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality & Build Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 3. Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 4. Type Check (TypeScript strict verification)
        run: npx tsc --noEmit

      - name: 5. Lint Check (ESLint warnings inspection)
        run: npm run lint || true

      - name: 6. Build Next.js Application
        env:
          NEXT_PUBLIC_API_URL: https://api.freightagent.com/api/v1
          NEXT_PUBLIC_APP_URL: https://freightagent.com
          NEXT_PUBLIC_SOCKET_URL: https://api.freightagent.com
          NEXT_PUBLIC_ACCESS_TOKEN_KEY: access_token
          NEXT_PUBLIC_REFRESH_TOKEN_KEY: refresh_token
          NEXT_PUBLIC_SESSION_TOKEN_KEY: session_token
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
