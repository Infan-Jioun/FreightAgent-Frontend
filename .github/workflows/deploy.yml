name: Continuous Delivery (CD) - Deploy to AWS

on:
  push:
    branches: [main]

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ========================================================
  # STAGE 1: Automated Quality & Build Testing
  # ========================================================
  test-and-validate:
    name: Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Verify Types (TypeScript strict verification)
        run: npx tsc --noEmit

      - name: Verify Linting (Legacy warnings report)
        run: npm run lint || true

  # ========================================================
  # STAGE 2: Package (Docker) & Push (Docker Hub / AWS ECR)
  # ========================================================
  build-and-push:
    name: Package Docker & Push Registry
    needs: test-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/freightagent-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.PROD_NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.PROD_NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_ACCESS_TOKEN_KEY=access_token
            NEXT_PUBLIC_REFRESH_TOKEN_KEY=refresh_token
            NEXT_PUBLIC_SESSION_TOKEN_KEY=session_token
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY }}

  # ========================================================
  # STAGE 3: Deploy to Cloud (AWS EC2 / Virtual Server)
  # ========================================================
  deploy-to-aws:
    name: Deploy Container to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Execute Remote SSH Commands on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "1. Pulling latest Docker image from Docker Hub..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/freightagent-frontend:latest

            echo "2. Stopping existing container if running..."
            docker stop freightagent-frontend || true
            docker rm freightagent-frontend || true

            echo "3. Starting new production container..."
            docker run -d \
              --name freightagent-frontend \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e HOSTNAME=0.0.0.0 \
              -e BACKEND_API_URL="${{ secrets.PROD_BACKEND_API_URL }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/freightagent-frontend:latest

            echo "4. Pruning unused old dangling images..."
            docker image prune -f

            echo "5. Verifying container health..."
            docker ps --filter "name=freightagent-frontend"
